<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pyplot designer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="toolbar">
    <button id="add-axis-btn" class="btn btn-main btn-toolbar" onclick="sendAdd('axis')">Add Axis</button>
    <!-- <button id="add-label-btn" class="btn btn-main btn-toolbar" onclick="sendAdd('label')">Add Label</button> -->
    <button id="add-variable-btn" class="btn btn-main btn-toolbar" onclick="sendAdd('constant')">Add Constant</button>
    <div id="dark-mode-toggle"></div>
    <button class="btn btn-secondary btn-toolbar" onclick="openLayoutModal()">Set Layout</button>
    <button class="btn btn-secondary btn-toolbar" onclick="openImportExportModal()">Import/Export</button>
    <button class="btn btn-secondary btn-toolbar" onclick="copyPythonImportCode()">Quick Copy</button>
    <button class="btn btn-warn btn-toolbar" onclick="resetLayout()">Reset</button>
    <button id="autosave-toggle" onclick="toggleAutosave()" class="btn btn-secondary btn-toolbar toggle-button">Autosave: OFF</button>
  </div>

  <div class="main">
    <div class="left-panel" id="left-panel">
      <h2 class="panel-title">Element Inspector</h2>
      <div id="props" class="props-panel"></div>
      <div id="constraint-editor" class="constraint-modal hidden"></div>
    </div>

    <div class="resizer left-resizer" data-resize="left"></div>

    <div class="center-panel">
      <div id="canvas">
        <canvas id="grid" class="grid-bg"></canvas>
        <canvas id="arrows" class="arrows-bg"></canvas>
      </div>
    </div>

    <div class="resizer right-resizer" data-resize="right"></div>

    <div class="right-panel" id="right-panel">
      <h2 class="panel-title">Constraints</h2>
      <div id="constraints-list" class="list-container"></div>
      <br><br>
      <h2 class="panel-title">Constants</h2>
      <div id="constants-list" class="list-container"></div>
      <br><br>
      <h2 class="panel-title">Elements</h2>
      <div id="elements-list" class="list-container"></div>
    </div>
  </div>

  <div id="status-bar" class="status-bar" data-level="ready" role="status" aria-live="polite">
    <span id="status-text">Status: Ready</span>
    <button id="status-action" class="btn btn-secondary btn-compact" type="button" style="display: none;">Cancel</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
